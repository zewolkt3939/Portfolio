<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#eaf1f2"/><g font-family="Noto Sans,Arial,sans-serif" fill="#192c35"><text x="65" y="70" font-size="16">P-070 / EVIAURA · EXPERIMENT DESIGN</text><text x="65" y="128" font-size="37" font-weight="600">Where does evidence become a claim?</text><path d="M170 310H1020" fill="none" stroke="#a8c0c7" stroke-width="3"/><g font-size="18" text-anchor="middle"><rect x="65" y="225" width="235" height="170" rx="5" fill="#fff" stroke="#cedade"/><rect x="345" y="225" width="235" height="170" rx="5" fill="#fff" stroke="#cedade"/><rect x="625" y="225" width="235" height="170" rx="5" fill="#fff" stroke="#cedade"/><rect x="905" y="225" width="235" height="170" rx="5" fill="#17656a"/><text x="182" y="275" font-size="13" fill="#60767f">DELIVERY</text><text x="182" y="320">HTTP / access log</text><text x="182" y="357" font-size="13">A request was received</text><text x="462" y="275" font-size="13" fill="#60767f">OBSERVATION</text><text x="462" y="320">Wazuh alert</text><text x="462" y="357" font-size="13">The event was detected</text><text x="742" y="275" font-size="13" fill="#60767f">EXPOSURE</text><text x="742" y="320">LLM context</text><text x="742" y="357" font-size="13">The model saw the input</text><g fill="#fff"><text x="1022" y="275" font-size="13">BEHAVIOUR</text><text x="1022" y="320">Controlled verdict</text><text x="1022" y="357" font-size="13">A change was attributed</text></g></g><text x="65" y="473" font-size="21" fill="#17656a">HTTP 200 alone cannot establish prompt-injection success.</text><text x="65" y="535" font-size="16" fill="#55656d">Conceptual evidence ladder derived from the team’s documented lab.</text></g></svg>