<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Unauthenticated Redis: incremental keyspace discovery</title><desc id="desc">Evaluating network-exposed in-memory data stores with non-blocking commands. Flow: STEP 01 (Port &amp; Protocol) -&gt; STEP 02 (Keyspace Scope) -&gt; STEP 03 (Safe Iteration) -&gt; STEP 04 (Type-Aware Read)</desc><rect width="900" height="480" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="444" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">WALKTHROUGH DIAGRAM / HTB REDEEMER</text><text x="36" y="82" fill="#222722" font-size="27" font-family="Georgia, serif">Unauthenticated Redis: incremental keyspace discovery</text><text x="36" y="110" fill="#60665e" font-size="14" font-family="Arial, sans-serif">Evaluating network-exposed in-memory data stores with non-blocking commands</text><rect x="36" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="48" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 01</text><text x="48" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Port &amp; Protocol</text><text x="48" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">TCP/6379 responds PONG to</text><text x="48" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">PING</text><path d="M232 185 H244" stroke="#405d47" stroke-width="1.5"/><polygon points="244,181 250,185 244,189" fill="#405d47"/><rect x="248" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="260" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 02</text><text x="260" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Keyspace Scope</text><text x="260" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">INFO keyspace &amp; DBSIZE</text><text x="260" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">check volume</text><path d="M444 185 H456" stroke="#405d47" stroke-width="1.5"/><polygon points="456,181 462,185 456,189" fill="#405d47"/><rect x="460" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="472" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 03</text><text x="472" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Safe Iteration</text><text x="472" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">SCAN 0 MATCH * avoids KEYS</text><text x="472" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">blocking *</text><path d="M656 185 H668" stroke="#405d47" stroke-width="1.5"/><polygon points="668,181 674,185 668,189" fill="#405d47"/><rect x="672" y="136" width="192" height="98" fill="#e6ece5" stroke="#405d47" stroke-width="1.2"/><text x="684" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 04</text><text x="684" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Type-Aware Read</text><text x="684" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">TYPE key -&gt; GET + Redis</text><text x="684" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">ACL fix</text><rect x="36" y="258" width="404" height="156" fill="#f6efec" stroke="#d0d5ca"/><rect x="36" y="258" width="4" height="156" fill="#875149"/><text x="52" y="282" fill="#875149" font-size="11" font-family="Consolas, monospace" font-weight="600">EXPOSURE CHAIN</text><text x="52" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Network bind without authentication</text><text x="52" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Redis bound to 0.0.0.0 without requirepass / ACL</text><text x="52" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Any reachable client can enumerate keyspace in db0</text><text x="52" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Data read proven; OS command execution not implied</text><rect x="460" y="258" width="404" height="156" fill="#ebf0ea" stroke="#d0d5ca"/><rect x="460" y="258" width="4" height="156" fill="#405d47"/><text x="476" y="282" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">HARDENING BOUNDARY</text><text x="476" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Network isolation + Redis ACLs</text><text x="476" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Bind only to loopback or private application subnet</text><text x="476" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Define per-service ACL users with restricted commands</text><text x="476" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Enable TLS when traffic crosses untrusted links</text><text x="36" y="450" fill="#405d47" font-size="12" font-family="Consolas, monospace">Reference walkthrough diagram | Illustrates non-destructive Redis assessment &amp; ACL remediation</text></svg>