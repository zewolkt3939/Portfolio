<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">SQL injection login bypass &amp; prepared statement fix</title><desc id="desc">How unparameterized string interpolation allows comment truncation in authentication queries. Flow: STEP 01 (HTTP Login POST) -&gt; STEP 02 (String Concat) -&gt; STEP 03 (Query Evaluation) -&gt; STEP 04 (Remediation)</desc><rect width="900" height="480" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="444" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">WALKTHROUGH DIAGRAM / HTB APPOINTMENT</text><text x="36" y="82" fill="#222722" font-size="27" font-family="Georgia, serif">SQL injection login bypass &amp; prepared statement fix</text><text x="36" y="110" fill="#60665e" font-size="14" font-family="Arial, sans-serif">How unparameterized string interpolation allows comment truncation in authentication queries</text><rect x="36" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="48" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 01</text><text x="48" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">HTTP Login POST</text><text x="48" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">username=admin&#x27;# &amp;</text><text x="48" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">password=lab</text><path d="M232 185 H244" stroke="#405d47" stroke-width="1.5"/><polygon points="244,181 250,185 244,189" fill="#405d47"/><rect x="248" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="260" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 02</text><text x="260" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">String Concat</text><text x="260" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Quote closes literal; #</text><text x="260" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">starts SQL comment</text><path d="M444 185 H456" stroke="#405d47" stroke-width="1.5"/><polygon points="456,181 462,185 456,189" fill="#405d47"/><rect x="460" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="472" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 03</text><text x="472" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Query Evaluation</text><text x="472" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">AND password=... is by</text><text x="472" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">ignored parser</text><path d="M656 185 H668" stroke="#405d47" stroke-width="1.5"/><polygon points="668,181 674,185 668,189" fill="#405d47"/><rect x="672" y="136" width="192" height="98" fill="#e6ece5" stroke="#405d47" stroke-width="1.2"/><text x="684" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 04</text><text x="684" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Remediation</text><text x="684" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Bind parameters (?, ?) +</text><text x="684" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">hash check</text><rect x="36" y="258" width="404" height="156" fill="#f6efec" stroke="#d0d5ca"/><rect x="36" y="258" width="4" height="156" fill="#875149"/><text x="52" y="282" fill="#875149" font-size="11" font-family="Consolas, monospace" font-weight="600">VULNERABLE PATH</text><text x="52" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Concatenated SQL string</text><text x="52" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• WHERE username=&#x27;admin&#x27;#&#x27; AND password=&#x27;...&#x27;</text><text x="52" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Input data alters SQL syntax tree directly</text><text x="52" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Returns admin row without password match</text><rect x="460" y="258" width="404" height="156" fill="#ebf0ea" stroke="#d0d5ca"/><rect x="460" y="258" width="4" height="156" fill="#405d47"/><text x="476" y="282" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">VERIFIED REMEDIATION</text><text x="476" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Parameterized query + password hash</text><text x="476" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• SELECT id, hash FROM users WHERE username = ?</text><text x="476" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Quote &amp; # treated strictly as literal characters</text><text x="476" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Regression test: valid names with apostrophes work</text><text x="36" y="450" fill="#405d47" font-size="12" font-family="Consolas, monospace">Teaching diagram for authorized lab study | No live HTB flag or proprietary source claimed</text></svg>