<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">From SQL injection to OS command execution &amp; privilege boundary review</title><desc id="desc">Chaining web database misconfiguration with overly permissive local sudo rules. Flow: STAGE 01 (Session &amp; SQLi) -&gt; STAGE 02 (DB Role Check) -&gt; STAGE 03 (Foothold Audit) -&gt; STAGE 04 (Privilege Review)</desc><rect width="900" height="480" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="444" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">WALKTHROUGH DIAGRAM / HTB VACCINE</text><text x="36" y="82" fill="#222722" font-size="27" font-family="Georgia, serif">From SQL injection to OS command execution &amp; privilege boundary review</text><text x="36" y="110" fill="#60665e" font-size="14" font-family="Arial, sans-serif">Chaining web database misconfiguration with overly permissive local sudo rules</text><rect x="36" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="48" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STAGE 01</text><text x="48" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Session &amp; SQLi</text><text x="48" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Weak cookie/login -&gt; GET</text><text x="48" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">search parameter</text><path d="M232 185 H244" stroke="#405d47" stroke-width="1.5"/><polygon points="244,181 250,185 244,189" fill="#405d47"/><rect x="248" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="260" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STAGE 02</text><text x="260" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">DB Role Check</text><text x="260" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">PostgreSQL superuser COPY</text><text x="260" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">allows PROGRAM</text><path d="M444 185 H456" stroke="#405d47" stroke-width="1.5"/><polygon points="456,181 462,185 456,189" fill="#405d47"/><rect x="460" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="472" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STAGE 03</text><text x="472" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Foothold Audit</text><text x="472" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Service shell runs under</text><text x="472" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">postgres/www user</text><path d="M656 185 H668" stroke="#405d47" stroke-width="1.5"/><polygon points="668,181 674,185 668,189" fill="#405d47"/><rect x="672" y="136" width="192" height="98" fill="#e6ece5" stroke="#405d47" stroke-width="1.2"/><text x="684" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STAGE 04</text><text x="684" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Privilege Review</text><text x="684" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">sudo -l permits editor</text><text x="684" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">escape (GTFOBins)</text><rect x="36" y="258" width="404" height="156" fill="#f6efec" stroke="#d0d5ca"/><rect x="36" y="258" width="4" height="156" fill="#875149"/><text x="52" y="282" fill="#875149" font-size="11" font-family="Consolas, monospace" font-weight="600">CHAINED WEAKNESSES</text><text x="52" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Why one bug became full compromise</text><text x="52" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Web query concatenated raw GET filter parameter</text><text x="52" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Web app connected as PostgreSQL superuser role</text><text x="52" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Sudoers allowed interactive vi without shell restriction</text><rect x="460" y="258" width="404" height="156" fill="#ebf0ea" stroke="#d0d5ca"/><rect x="460" y="258" width="4" height="156" fill="#405d47"/><text x="476" y="282" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">DEFENSE IN DEPTH</text><text x="476" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Breaking the chain at every layer</text><text x="476" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Parameterize search queries in application code</text><text x="476" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Run DB connection with least-privilege SELECT/INSERT role</text><text x="476" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Use sudoedit / noexec instead of unrestricted binary sudo</text><text x="36" y="450" fill="#405d47" font-size="12" font-family="Consolas, monospace">Reference study note | Focuses on multi-layer blast radius containment and least privilege</text></svg>