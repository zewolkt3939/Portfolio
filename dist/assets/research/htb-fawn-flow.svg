<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Anonymous FTP exposure: separating reachability from read access</title><desc id="desc">Structured verification from service discovery to directory listing and file retrieval. Flow: STEP 01 (Service Discovery) -&gt; STEP 02 (Auth Check) -&gt; STEP 03 (Data Channel) -&gt; STEP 04 (Hardening)</desc><rect width="900" height="480" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="444" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">WALKTHROUGH DIAGRAM / HTB FAWN</text><text x="36" y="82" fill="#222722" font-size="27" font-family="Georgia, serif">Anonymous FTP exposure: separating reachability from read access</text><text x="36" y="110" fill="#60665e" font-size="14" font-family="Arial, sans-serif">Structured verification from service discovery to directory listing and file retrieval</text><rect x="36" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="48" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 01</text><text x="48" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Service Discovery</text><text x="48" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">nmap -sV -p 21 confirms</text><text x="48" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">vsftpd</text><path d="M232 185 H244" stroke="#405d47" stroke-width="1.5"/><polygon points="244,181 250,185 244,189" fill="#405d47"/><rect x="248" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="260" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 02</text><text x="260" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Auth Check</text><text x="260" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">USER anonymous / PASS</text><text x="260" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">guest accepted (230)</text><path d="M444 185 H456" stroke="#405d47" stroke-width="1.5"/><polygon points="456,181 462,185 456,189" fill="#405d47"/><rect x="460" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="472" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 03</text><text x="472" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Data Channel</text><text x="472" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">PASV/LIST enumerates</text><text x="472" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">public directory</text><path d="M656 185 H668" stroke="#405d47" stroke-width="1.5"/><polygon points="668,181 674,185 668,189" fill="#405d47"/><rect x="672" y="136" width="192" height="98" fill="#e6ece5" stroke="#405d47" stroke-width="1.2"/><text x="684" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STEP 04</text><text x="684" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Hardening</text><text x="684" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">anonymous_enable=NO or</text><text x="684" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">strict chroot</text><rect x="36" y="258" width="404" height="156" fill="#f6efec" stroke="#d0d5ca"/><rect x="36" y="258" width="4" height="156" fill="#875149"/><text x="52" y="282" fill="#875149" font-size="11" font-family="Consolas, monospace" font-weight="600">OBSERVED EXPOSURE</text><text x="52" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Misconfigured public root</text><text x="52" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• TCP/21 allows unauthenticated anonymous login</text><text x="52" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Sensitive file placed inside readable FTP directory</text><text x="52" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Transport encryption alone would not block access</text><rect x="460" y="258" width="404" height="156" fill="#ebf0ea" stroke="#d0d5ca"/><rect x="460" y="258" width="4" height="156" fill="#405d47"/><text x="476" y="282" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">DEFENSIVE CONTROL</text><text x="476" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Access control + audit verification</text><text x="476" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Disable anonymous access when public share is unneeded</text><text x="476" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Separate public dropbox from internal files</text><text x="476" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Verify with post-change nmap ftp-anon retest</text><text x="36" y="450" fill="#405d47" font-size="12" font-family="Consolas, monospace">Reference walkthrough diagram | Separates network reachability, authentication, and file permissions</text></svg>