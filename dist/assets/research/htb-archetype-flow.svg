<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">SMB configuration leak to MSSQL command execution</title><desc id="desc">How readable deployment artifacts expose database credentials and administrative procedures. Flow: STAGE 01 (SMB Share Audit) -&gt; STAGE 02 (Artifact Review) -&gt; STAGE 03 (MSSQL Auth) -&gt; STAGE 04 (Host Boundary)</desc><rect width="900" height="480" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="444" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">WALKTHROUGH DIAGRAM / HTB ARCHETYPE</text><text x="36" y="82" fill="#222722" font-size="27" font-family="Georgia, serif">SMB configuration leak to MSSQL command execution</text><text x="36" y="110" fill="#60665e" font-size="14" font-family="Arial, sans-serif">How readable deployment artifacts expose database credentials and administrative procedures</text><rect x="36" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="48" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STAGE 01</text><text x="48" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">SMB Share Audit</text><text x="48" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Anonymous read on</text><text x="48" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">\\target\backups</text><path d="M232 185 H244" stroke="#405d47" stroke-width="1.5"/><polygon points="244,181 250,185 244,189" fill="#405d47"/><rect x="248" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="260" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STAGE 02</text><text x="260" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Artifact Review</text><text x="260" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">prod.dtsConfig exposes SQL</text><text x="260" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">password</text><path d="M444 185 H456" stroke="#405d47" stroke-width="1.5"/><polygon points="456,181 462,185 456,189" fill="#405d47"/><rect x="460" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="472" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STAGE 03</text><text x="472" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">MSSQL Auth</text><text x="472" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Valid login holds sysadmin</text><text x="472" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">privileges</text><path d="M656 185 H668" stroke="#405d47" stroke-width="1.5"/><polygon points="668,181 674,185 668,189" fill="#405d47"/><rect x="672" y="136" width="192" height="98" fill="#e6ece5" stroke="#405d47" stroke-width="1.2"/><text x="684" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">STAGE 04</text><text x="684" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Host Boundary</text><text x="684" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">xp_cmdshell enabled -&gt; OS</text><text x="684" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">command run</text><rect x="36" y="258" width="404" height="156" fill="#f6efec" stroke="#d0d5ca"/><rect x="36" y="258" width="4" height="156" fill="#875149"/><text x="52" y="282" fill="#875149" font-size="11" font-family="Consolas, monospace" font-weight="600">OPERATIONAL FAILURE</text><text x="52" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Credential reuse &amp; excessive DB privileges</text><text x="52" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Deployment share readable by unauthenticated guests</text><text x="52" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Plaintext connection string stored in backup artifact</text><text x="52" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Database service account granted sysadmin + xp_cmdshell</text><rect x="460" y="258" width="404" height="156" fill="#ebf0ea" stroke="#d0d5ca"/><rect x="460" y="258" width="4" height="156" fill="#405d47"/><text x="476" y="282" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">REMEDIATION CONTROLS</text><text x="476" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Secret hygiene &amp; service hardening</text><text x="476" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Restrict SMB shares to authenticated deployment principals</text><text x="476" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Remove plaintext secrets from config/backup repositories</text><text x="476" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Disable xp_cmdshell and run SQL service under low-priv account</text><text x="36" y="450" fill="#405d47" font-size="12" font-family="Consolas, monospace">Reference study note | Connects secret management, network share ACLs, and database hardening</text></svg>