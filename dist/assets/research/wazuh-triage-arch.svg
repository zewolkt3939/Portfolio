<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">AI-assisted Wazuh alert prioritization with deterministic guardrails</title><desc id="desc">Combining repeatable heuristic baselines with optional, schema-bounded LLM enrichment. Flow: COLLECTION (Wazuh Collector) -&gt; PRIVACY GATE (PII Redactor) -&gt; SCORING (Heuristic + LLM) -&gt; DISPATCH (Policy &amp; Webhook)</desc><rect width="900" height="480" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="444" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">CASE STUDY DIAGRAM / SOC AUTOMATION</text><text x="36" y="82" fill="#222722" font-size="27" font-family="Georgia, serif">AI-assisted Wazuh alert prioritization with deterministic guardrails</text><text x="36" y="110" fill="#60665e" font-size="14" font-family="Arial, sans-serif">Combining repeatable heuristic baselines with optional, schema-bounded LLM enrichment</text><rect x="36" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="48" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">COLLECTION</text><text x="48" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Wazuh Collector</text><text x="48" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Cursor pagination +</text><text x="48" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">identity deduplication</text><path d="M232 185 H244" stroke="#405d47" stroke-width="1.5"/><polygon points="244,181 250,185 244,189" fill="#405d47"/><rect x="248" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="260" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">PRIVACY GATE</text><text x="260" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">PII Redactor</text><text x="260" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Mask sensitive tokens/IPs</text><text x="260" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">before external call</text><path d="M444 185 H456" stroke="#405d47" stroke-width="1.5"/><polygon points="456,181 462,185 456,189" fill="#405d47"/><rect x="460" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="472" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">SCORING</text><text x="472" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Heuristic + LLM</text><text x="472" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Rule baseline always LLM</text><text x="472" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">active; optional</text><path d="M656 185 H668" stroke="#405d47" stroke-width="1.5"/><polygon points="668,181 674,185 668,189" fill="#405d47"/><rect x="672" y="136" width="192" height="98" fill="#e6ece5" stroke="#405d47" stroke-width="1.2"/><text x="684" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">DISPATCH</text><text x="684" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Policy &amp; Webhook</text><text x="684" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Correlated high-priority</text><text x="684" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">cases -&gt; Telegram/n8n</text><rect x="36" y="258" width="404" height="156" fill="#f6efec" stroke="#d0d5ca"/><rect x="36" y="258" width="4" height="156" fill="#875149"/><text x="52" y="282" fill="#875149" font-size="11" font-family="Consolas, monospace" font-weight="600">TRUST BOUNDARIES</text><text x="52" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Failure modes addressed by design</text><text x="52" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Duplicate alert deliveries -&gt; source-identity deduplication</text><text x="52" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• External LLM outage -&gt; seamless deterministic heuristic fallback</text><text x="52" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Untrusted model prose -&gt; strict schema &amp; priority floor check</text><rect x="460" y="258" width="404" height="156" fill="#ebf0ea" stroke="#d0d5ca"/><rect x="460" y="258" width="4" height="156" fill="#405d47"/><text x="476" y="282" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">OPERATIONAL READINESS</text><text x="476" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Testable backend &amp; container workflow</text><text x="476" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Covers SQLi, XSS, brute force, LFI, and DoS alert families</text><text x="476" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Separate /health/live and /health/ready endpoints</text><text x="476" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Structured JSON logging for pipeline observability</text><text x="36" y="450" fill="#405d47" font-size="12" font-family="Consolas, monospace">Public Flask/Docker implementation | Designed for analyst verification, not blind automation</text></svg>