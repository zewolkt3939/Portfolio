<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Yocto OSS inventory, CVE triage, and two-stage backport verification</title><desc id="desc">Moving from 1,375 scanned source records to verified recipe patches in webOS OSE. Flow: INVENTORY (FOSSLight Yocto) -&gt; TRIAGE (CPE/PURL + Context) -&gt; REMEDIATION (Targeted Backport) -&gt; VALIDATION (2-Stage Rebuild)</desc><rect width="900" height="480" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="444" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">CASE STUDY DIAGRAM / SUPPLY-CHAIN ASSURANCE</text><text x="36" y="82" fill="#222722" font-size="27" font-family="Georgia, serif">Yocto OSS inventory, CVE triage, and two-stage backport verification</text><text x="36" y="110" fill="#60665e" font-size="14" font-family="Arial, sans-serif">Moving from 1,375 scanned source records to verified recipe patches in webOS OSE</text><rect x="36" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="48" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">INVENTORY</text><text x="48" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">FOSSLight Yocto</text><text x="48" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">1,375 records / 444 (99.4%</text><text x="48" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">components ID)</text><path d="M232 185 H244" stroke="#405d47" stroke-width="1.5"/><polygon points="244,181 250,185 244,189" fill="#405d47"/><rect x="248" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="260" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">TRIAGE</text><text x="260" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">CPE/PURL + Context</text><text x="260" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Filter 4 high/critical by</text><text x="260" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">CVEs reachability</text><path d="M444 185 H456" stroke="#405d47" stroke-width="1.5"/><polygon points="456,181 462,185 456,189" fill="#405d47"/><rect x="460" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="472" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">REMEDIATION</text><text x="472" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Targeted Backport</text><text x="472" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Apply CVE patch in recipe</text><text x="472" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">(0 version bumps)</text><path d="M656 185 H668" stroke="#405d47" stroke-width="1.5"/><polygon points="668,181 674,185 668,189" fill="#405d47"/><rect x="672" y="136" width="192" height="98" fill="#e6ece5" stroke="#405d47" stroke-width="1.2"/><text x="684" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">VALIDATION</text><text x="684" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">2-Stage Rebuild</text><text x="684" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Component build -&gt; full</text><text x="684" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">raspberrypi4 image</text><rect x="36" y="258" width="404" height="156" fill="#f6efec" stroke="#d0d5ca"/><rect x="36" y="258" width="4" height="156" fill="#875149"/><text x="52" y="282" fill="#875149" font-size="11" font-family="Consolas, monospace" font-weight="600">SCANNER LIMITATION</text><text x="52" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Why CVSS and version strings are not enough</text><text x="52" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• 8 records lacked version strings -&gt; explicit uncertainty gap</text><text x="52" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Backported fixes keep original upstream version (e.g. 3.0.7)</text><text x="52" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Version-only re-scans still flag already-patched recipes</text><rect x="460" y="258" width="404" height="156" fill="#ebf0ea" stroke="#d0d5ca"/><rect x="460" y="258" width="4" height="156" fill="#405d47"/><text x="476" y="282" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">AUDITABLE EVIDENCE</text><text x="476" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Traceable patch provenance</text><text x="476" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Validated fixes for OpenSSL, libxml2, and curl (CVE-2023-38545)</text><text x="476" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Component build provides fast feedback before image build</text><text x="476" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Build metadata + recipe patch list serve as source of truth</text><text x="36" y="450" fill="#405d47" font-size="12" font-family="Consolas, monospace">Individual OSSVS technical report | Sanitized architecture &amp; verification metrics</text></svg>