<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">High entropy is not proof of malice.</title><desc id="desc">Five binary section fixtures / Shannon entropy (bits/byte) + import &amp; permission heuristics; standard code section (H=3.93) / Clean / Benign / Normal; packed RWX stub (H=8.0) / Flagged / Flagged (Review); benign compressed resource (H=8.0) / Flagged / Benign / Normal; null-padded packed payload (H=3.57) / Clean / Flagged (Review); plain string table (H=3.91) / Clean / Benign / Normal</desc><rect width="900" height="460" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="424" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">LAB NOTE / EXECUTED RESULTS</text><text x="36" y="84" fill="#222722" font-size="28" font-family="Georgia, serif">High entropy is not proof of malice.</text><text x="36" y="114" fill="#60665e" font-size="14" font-family="Arial, sans-serif">Five binary section fixtures / Shannon entropy (bits/byte) + import &amp; permission heuristics</text><rect x="36" y="138" width="828" height="32" fill="#e4e7dd"/><text x="44" y="159" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">SECTION PROFILE (H BITS/B)</text><text x="473" y="159" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">ENTROPY &gt;= 7.2 ONLY</text><text x="683" y="159" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">MULTI-SIGNAL TRIAGE</text><text x="44" y="196" fill="#222722" font-size="14" font-family="Arial, sans-serif">standard code section (H=3.93)</text><text x="473" y="196" fill="#222722" font-size="14" font-family="Arial, sans-serif">Clean</text><text x="683" y="196" fill="#222722" font-size="14" font-family="Arial, sans-serif">Benign / Normal</text><path d="M36 206 H864" stroke="#d0