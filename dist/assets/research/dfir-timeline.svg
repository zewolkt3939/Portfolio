<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Correlating web access logs, authentication events, and host persistence</title><desc id="desc">Reconstructing an intrusion path across three independent telemetry sources. Flow: 08:12:04Z (Nginx access.log) -&gt; 08:14:19Z (Process / Subshell) -&gt; 08:16:42Z (Linux auth.log) -&gt; 08:18:05Z (Persistence Check)</desc><rect width="900" height="480" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="444" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">DFIR CASE NOTE / INCIDENT TIMELINE</text><text x="36" y="82" fill="#222722" font-size="27" font-family="Georgia, serif">Correlating web access logs, authentication events, and host persistence</text><text x="36" y="110" fill="#60665e" font-size="14" font-family="Arial, sans-serif">Reconstructing an intrusion path across three independent telemetry sources</text><rect x="36" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="48" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">08:12:04Z</text><text x="48" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Nginx access.log</text><text x="48" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Scanner 404 burst -&gt; POST</text><text x="48" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">upload 200</text><path d="M232 185 H244" stroke="#405d47" stroke-width="1.5"/><polygon points="244,181 250,185 244,189" fill="#405d47"/><rect x="248" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="260" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">08:14:19Z</text><text x="260" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Process / Subshell</text><text x="260" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">www-data spawns sh -c id;</text><text x="260" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">whoami</text><path d="M444 185 H456" stroke="#405d47" stroke-width="1.5"/><polygon points="456,181 462,185 456,189" fill="#405d47"/><rect x="460" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="472" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">08:16:42Z</text><text x="472" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Linux auth.log</text><text x="472" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Accepted publickey for</text><text x="472" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">deploy user</text><path d="M656 185 H668" stroke="#405d47" stroke-width="1.5"/><polygon points="668,181 674,185 668,189" fill="#405d47"/><rect x="672" y="136" width="192" height="98" fill="#e6ece5" stroke="#405d47" stroke-width="1.2"/><text x="684" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">08:18:05Z</text><text x="684" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Persistence Check</text><text x="684" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">authorized_keys &amp; modified</text><text x="684" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">/etc/cron.d</text><rect x="36" y="258" width="404" height="156" fill="#f6efec" stroke="#d0d5ca"/><rect x="36" y="258" width="4" height="156" fill="#875149"/><text x="52" y="282" fill="#875149" font-size="11" font-family="Consolas, monospace" font-weight="600">SINGLE-LOG BLIND SPOT</text><text x="52" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Why isolated logs mislead</text><text x="52" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• HTTP 200 on file upload looks benign without child-process trace</text><text x="52" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• SSH login looks legitimate without preceding web-shell write</text><text x="52" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Clock skew between services breaks naive timestamp sorting</text><rect x="460" y="258" width="404" height="156" fill="#ebf0ea" stroke="#d0d5ca"/><rect x="460" y="258" width="4" height="156" fill="#405d47"/><text x="476" y="282" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">TRIAGE CORRELATION</text><text x="476" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Normalized UTC timeline + entity pivot</text><text x="476" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Pivot from source IP -&gt; uploaded filename -&gt; worker PID</text><text x="476" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Correlate file mtime with auth.log session open</text><text x="476" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Scope remediation: rotate keys, remove cron, patch upload</text><text x="36" y="450" fill="#405d47" font-size="12" font-family="Consolas, monospace">Synthetic DFIR lab reconstruction | Demonstrates multi-source timeline correlation</text></svg>