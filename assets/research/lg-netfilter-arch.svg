<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">webOS OSE packet validation &amp; dual-group NFLOG telemetry</title><desc id="desc">End-to-end verification loop from Scapy packet synthesis to structured JSON audit logs. Flow: GENERATOR (Windows + Scapy) -&gt; EARLY HOOK (mangle PREROUTING) -&gt; POLICY HOOK (filter INPUT) -&gt; TELEMETRY (ulogd2 Pipeline)</desc><rect width="900" height="480" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="444" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">CASE STUDY DIAGRAM / EMBEDDED LINUX SECURITY</text><text x="36" y="82" fill="#222722" font-size="27" font-family="Georgia, serif">webOS OSE packet validation &amp; dual-group NFLOG telemetry</text><text x="36" y="110" fill="#60665e" font-size="14" font-family="Arial, sans-serif">End-to-end verification loop from Scapy packet synthesis to structured JSON audit logs</text><rect x="36" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="48" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">GENERATOR</text><text x="48" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">Windows + Scapy</text><text x="48" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">IPv4/IPv6, VLAN, SYN LAND</text><text x="48" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">flood,</text><path d="M232 185 H244" stroke="#405d47" stroke-width="1.5"/><polygon points="244,181 250,185 244,189" fill="#405d47"/><rect x="248" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="260" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">EARLY HOOK</text><text x="260" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">mangle PREROUTING</text><text x="260" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Detect &amp; log spoofed 110)</text><text x="260" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">frames (NFLOG</text><path d="M444 185 H456" stroke="#405d47" stroke-width="1.5"/><polygon points="456,181 462,185 456,189" fill="#405d47"/><rect x="460" y="136" width="192" height="98" fill="#fbfaf7" stroke="#c5c9c0" stroke-width="1.2"/><text x="472" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">POLICY HOOK</text><text x="472" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">filter INPUT</text><text x="472" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Whitelist, multicast &amp;</text><text x="472" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">rate-limit rules</text><path d="M656 185 H668" stroke="#405d47" stroke-width="1.5"/><polygon points="668,181 674,185 668,189" fill="#405d47"/><rect x="672" y="136" width="192" height="98" fill="#e6ece5" stroke="#405d47" stroke-width="1.2"/><text x="684" y="160" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">TELEMETRY</text><text x="684" y="186" fill="#222722" font-size="15" font-family="Georgia, serif" font-weight="600">ulogd2 Pipeline</text><text x="684" y="208" fill="#60665e" font-size="12" font-family="Arial, sans-serif">Parallel LOGEMU text +</text><text x="684" y="224" fill="#60665e" font-size="12" font-family="Arial, sans-serif">JSON audit output</text><rect x="36" y="258" width="404" height="156" fill="#f6efec" stroke="#d0d5ca"/><rect x="36" y="258" width="4" height="156" fill="#875149"/><text x="52" y="282" fill="#875149" font-size="11" font-family="Consolas, monospace" font-weight="600">ENGINEERING EDGE CASES</text><text x="52" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Why naive firewall testing fails</text><text x="52" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• rp_filter drops spoofed LAND packets before INPUT chain</text><text x="52" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Two ulogd2 stacks cannot bind the same NFLOG group</text><text x="52" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• Missing IFINDEX/HWHDR plugins omit interface metadata</text><rect x="460" y="258" width="404" height="156" fill="#ebf0ea" stroke="#d0d5ca"/><rect x="460" y="258" width="4" height="156" fill="#405d47"/><text x="476" y="282" fill="#405d47" font-size="11" font-family="Consolas, monospace" font-weight="600">VALIDATED ARCHITECTURE</text><text x="476" y="306" fill="#222722" font-size="16" font-family="Georgia, serif" font-weight="600">Observable enforcement on Raspberry Pi 4</text><text x="476" y="336" fill="#222722" font-size="13" font-family="Arial, sans-serif">• 10/10 non-whitelisted IPv4 unicast packets dropped</text><text x="476" y="360" fill="#222722" font-size="13" font-family="Arial, sans-serif">• 29 IPv6 anycast packets counted and logged accurately</text><text x="476" y="384" fill="#222722" font-size="13" font-family="Arial, sans-serif">• JSON = TEXT + 100 group split preserves both log formats</text><text x="36" y="450" fill="#405d47" font-size="12" font-family="Consolas, monospace">Team deliverable at LG Electronics R&amp;D Vietnam | Baseline -&gt; Control -&gt; Capture -&gt; Verify</text></svg>