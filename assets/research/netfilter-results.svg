<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Log spoofing before routing drops it.</title><desc id="desc">Six packet profiles / INPUT-only logging vs PREROUTING + INPUT NFLOG groups; whitelisted IPv4 unicast (TCP/443) / allowed / allowed; LAND spoof (src == dst) (TCP/80) / silent drop / nflog-prerouting; RFC1918 martian source (UDP/53) / silent drop / nflog-prerouting; unlisted IPv4 source (TCP/22) / logged / nflog-input; approved IPv6 multicast (ICMPv6) / allowed / allowed; unapproved multicast group (UDP/1900) / logged / nflog-input</desc><rect width="900" height="460" fill="#f0f1ea"/><rect x="18" y="18" width="864" height="424" fill="none" stroke="#d9dcd2" stroke-width="1"/><text x="36" y="46" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">LAB NOTE / EXECUTED RESULTS</text><text x="36" y="84" fill="#222722" font-size="28" font-family="Georgia, serif">Log spoofing before routing drops it.</text><text x="36" y="114" fill="#60665e" font-size="14" font-family="Arial, sans-serif">Six packet profiles / INPUT-only logging vs PREROUTING + INPUT NFLOG groups</text><rect x="36" y="138" width="828" height="32" fill="#e4e7dd"/><text x="44" y="159" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">PACKET PROFILE</text><text x="473" y="159" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">INPUT-ONLY LOG</text><text x="683" y="159" fill="#405d47" font-size="12" font-family="Consolas, monospace" font-weight="600">DUAL-HOOK NFLOG</text><text x="44" y="196" fill="#222722" font-size="14" font-family="Arial, sans-serif">whitelisted IPv4 unicast (TCP/443)</text><text x="473" y="196" fill="#222722" font-size="14" font-family="Arial, sans-serif">allowed</text><text x="683" y="196" fill="#222722" font-size="14" font-family="Arial, sans-serif">allowed</text><path d="M36 206 H864" stroke="#d0d5ca"/><text x="44" y="228" fill="#222722" font-size="14" font-family="Arial, sans-serif">LAND spoof (src == dst) (TCP/80)</text><text x="473" y="228" fill="#875149" font-size="14" font-family="Arial, sans-serif">silent drop</text><text x="683" y="228" fill="#405d47" font-size="14" font-family="Arial, sans-serif">nflog-prerouting</text><path d="M36 238 H864" stroke="#d0d5ca"/><text x="44" y="260" fill="#222722" font-size="14" font-family="Arial, sans-serif">RFC1918 martian source (UDP/53)</text><text x="473" y="260" fill="#875149" font-size="14" font-family="Arial, sans-serif">silent drop</text><text x="683" y="260" fill="#405d47" font-size="14" font-family="Arial, sans-serif">nflog-prerouting</text><path d="M36 270 H864" stroke="#d0d5ca"/><text x="44" y="292" fill="#222722" font-size="14" font-family="Arial, sans-serif">unlisted IPv4 source (TCP/22)</text><text x="473" y="292" fill="#222722" font-size="14" font-family="Arial, sans-serif">logged</text><text x="683" y="292" fill="#405d47" font-size="14" font-family="Arial, sans-serif">nflog-input</text><path d="M36 302 H864" stroke="#d0d5ca"/><text x="44" y="324" fill="#222722" font-size="14" font-family="Arial, sans-serif">approved IPv6 multicast (ICMPv6)</text><text x="473" y="324" fill="#222722" font-size="14" font-family="Arial, sans-serif">allowed</text><text x="683" y="324" fill="#222722" font-size="14" font-family="Arial, sans-serif">allowed</text><path d="M36 334 H864" stroke="#d0d5ca"/><text x="44" y="356" fill="#222722" font-size="14" font-family="Arial, sans-serif">unapproved multicast group (UDP/1900)</text><text x="473" y="356" fill="#222722" font-size="14" font-family="Arial, sans-serif">logged</text><text x="683" y="356" fill="#405d47" font-size="14" font-family="Arial, sans-serif">nflog-input</text><text x="36" y="426" fill="#405d47" font-size="12" font-family="Consolas, monospace">Dropped packets with audit trail: 2/4 INPUT-only vs 4/4 dual-hook</text></svg>