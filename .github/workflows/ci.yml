name: test-and-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check portfolio_cms migrations tests
      - run: python -m pytest --cov=portfolio_cms --cov-report=term-missing
      - run: python -m bandit -q -r portfolio_cms -c pyproject.toml
      - run: python -m pip_audit . --cache-dir .audit-cache
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./migration-test.db
      - run: portfolio-cms seed-legacy
        env:
          DATABASE_URL: sqlite:///./migration-test.db
      - run: python tools/build_site.py && python tools/check_site.py && python tools/package_site.py
      - run: >-
          docker run --rm
          -e SITE_ADDRESS=example.com
          -e WWW_ADDRESS=www.example.com
          -e ANALYTICS_ADDRESS=analytics.example.com
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/portfolio-cms:${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/portfolio-cms:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
