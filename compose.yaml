x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${APP_IMAGE:-portfolio-cms:local}
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:${PORTFOLIO_DB_PASSWORD}@postgres:5432/portfolio
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      UPLOAD_DIR: /data/uploads
      SECURE_COOKIES: ${SECURE_COOKIES}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS}
      NOTION_API_TOKEN: ${NOTION_API_TOKEN}
      NOTION_API_VERSION: ${NOTION_API_VERSION}
      ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL}
      ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8000"]
    volumes: ["uploads:/data/uploads"]
    networks: [private]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-umami.sh:ro
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    logging: *default-logging
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      WWW_ADDRESS: ${WWW_ADDRESS}
      ANALYTICS_ADDRESS: ${ANALYTICS_ADDRESS}
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - uploads:/srv/uploads:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private]
    logging: *default-logging
  umami:
    image: ${UMAMI_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_ENCRYPTION_KEY}
      DISABLE_TELEMETRY: 1
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["3000"]
    networks: [private]
    logging: *default-logging
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    profiles: ["maintenance"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/uploads:ro
      - backup-work:/backup-snapshot
      - restic-cache:/root/.cache/restic
    networks: [private]
    logging: *default-logging
networks:
  private:
volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
  backup-work:
  restic-cache:
