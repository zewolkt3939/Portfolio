[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nguyen-truong-bao-portfolio-cms"
version = "1.0.0"
description = "FastAPI CMS for a bilingual cybersecurity portfolio"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23,<26",
  "beautifulsoup4>=4.13,<5",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "jinja2>=3.1.6,<4",
  "linkify-it-py>=2,<3",
  "markdown-it-py>=3,<5",
  "mdit-py-plugins>=0.5,<1",
  "nh3>=0.3,<1",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyotp>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.2.2,<2",
  "requests>=2.33,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
portfolio-cms = "portfolio_cms.cli:main"

[tool.setuptools]
packages = ["portfolio_cms", "portfolio_cms.routes"]

[tool.setuptools.package-data]
portfolio_cms = ["templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

[tool.bandit]
exclude_dirs = ["tests"]
